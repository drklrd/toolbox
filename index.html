<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Useful Tools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fafafa;
      color: #171717;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 90px 0 60px;
    }

    header {
      margin-bottom: 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 750;
    }

    .subtitle {
      margin: 18px 0 0;
      color: #737373;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 19px 20px;
      border: 1px solid #e8e8e8;
      border-radius: 14px;

      background: #fff;
      color: #171717;
      text-decoration: none;

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .tool:hover {
      transform: translateY(-2px);
      border-color: #d8d8d8;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .tool-name {
      font-size: 1rem;
      font-weight: 550;
    }

    .arrow {
      color: #a0a0a0;
      font-size: 1.2rem;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .tool:hover .arrow {
      transform: translateX(3px);
      color: #171717;
    }

    footer {
      margin-top: 42px;
      color: #a0a0a0;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 60px;
      }

      header {
        margin-bottom: 32px;
      }

      .tool {
        padding: 17px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <h1>Toolbox</h1>
      <p class="subtitle">A small collection of simple, useful tools for human.</p>
    </header>

    <nav class="tools">

      <a class="tool" href="./financial-calculator/">
        <span class="tool-name">Financial Calculator</span>
        <span class="arrow">→</span>
      </a>

    </nav>

    <footer>
      Built for convenience.
    </footer>

  </main>

</body>
</html>
