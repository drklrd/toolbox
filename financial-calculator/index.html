<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FinCalc Pro — Premium Financial Calculators</title>
<meta name="description" content="76 professional-grade financial calculators. TVM, loans, investments, retirement, stocks & more. Free, premium tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FINCALC PRO — Premium Dark-Themed Design System
   ============================================================ */
:root {
  --bg-deepest: #06090f;
  --bg-deep: #0a0f18;
  --bg-base: #0f1729;
  --bg-elevated: #151d2e;
  --bg-card: #192237;
  --bg-card-hover: #1e2940;
  --bg-input: #0d1420;
  --bg-glass: rgba(25, 34, 55, 0.7);

  --border-subtle: rgba(255,255,255,0.05);
  --border-card: rgba(255,255,255,0.08);
  --border-input: rgba(255,255,255,0.10);
  --border-focus: rgba(99, 150, 255, 0.5);
  --border-accent: rgba(99, 150, 255, 0.25);

  --text-primary: #eef2f8;
  --text-secondary: #94a3b8;
  --text-tertiary: #5f6d80;
  --text-accent: #8cb4ff;

  --accent-1: #6396ff;
  --accent-2: #5b8af0;
  --accent-3: #7c5cf0;
  --accent-4: #4dd4c8;
  --accent-glow: rgba(99, 150, 255, 0.3);

  --gradient-hero: linear-gradient(135deg, #6396ff 0%, #7c5cf0 30%, #4dd4c8 70%, #6396ff 100%);
  --gradient-card: linear-gradient(145deg, rgba(99,150,255,0.08) 0%, rgba(124,92,240,0.06) 100%);
  --gradient-btn: linear-gradient(135deg, #6396ff, #5b8af0);
  --gradient-result: linear-gradient(135deg, rgba(99,150,255,0.12) 0%, rgba(124,92,240,0.08) 100%);
  --result-item-bg: rgba(255,255,255,0.03);
  --result-item-border: rgba(255,255,255,0.04);

  --success: #34d399;
  --warning: #fbbf24;
  --error: #f87171;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 8px 32px rgba(0,0,0,0.15);
  --shadow-card-hover: 0 2px 6px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.25), 0 0 0 1px var(--border-accent);
  --shadow-glow: 0 0 40px var(--accent-glow);
  --shadow-btn: 0 4px 16px rgba(99, 150, 255, 0.3);

  --transition-fast: 180ms cubic-bezier(0.22, 0.61, 0.36, 1);
  --transition-smooth: 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
  --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Light theme override — user toggle */
[data-theme="light"] {
  --bg-deepest: #f0f4f8;
  --bg-deep: #f4f7fb;
  --bg-base: #f8fafc;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #f8fafd;
  --bg-input: #ffffff;
  --bg-glass: rgba(255,255,255,0.85);

  --border-subtle: rgba(0,0,0,0.04);
  --border-card: rgba(0,0,0,0.07);
  --border-input: rgba(0,0,0,0.12);
  --border-focus: rgba(59, 130, 246, 0.5);
  --border-accent: rgba(59, 130, 246, 0.2);

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --text-accent: #2563eb;

  --gradient-result: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%);
  --result-item-bg: rgba(0,0,0,0.02);
  --result-item-border: rgba(0,0,0,0.04);

  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-card-hover: 0 2px 8px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06), 0 0 0 1px rgba(59,130,246,0.2);
}

/* Reset */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg-deepest);color:var(--text-primary);
  line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
input,select,button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit}
a{color:inherit;text-decoration:none}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* Background ambient */
.bg-ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:0.07;animation:orbFloat 20s ease-in-out infinite}
.bg-orb:nth-child(1){width:600px;height:600px;background:#6396ff;top:-200px;left:-150px;animation-delay:0s}
.bg-orb:nth-child(2){width:500px;height:500px;background:#7c5cf0;top:50%;right:-200px;animation-delay:-7s}
.bg-orb:nth-child(3){width:400px;height:400px;background:#4dd4c8;bottom:-150px;left:40%;animation-delay:-14s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(40px,-30px) scale(1.05)}50%{transform:translate(-20px,20px) scale(0.95)}75%{transform:translate(-30px,-20px) scale(1.02)}}

/* ============================================================
   LAYOUT — App Shell
   ============================================================ */
.app-shell{position:relative;z-index:1;min-height:100vh}

/* Header */
.app-header{
  position:sticky;top:0;z-index:100;
  background:var(--bg-glass);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border-subtle);
  padding:0 24px;height:60px;display:flex;align-items:center;gap:16px;
}
.header-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-0.3px;color:var(--text-primary)}
.header-logo{
  width:34px;height:34px;border-radius:10px;
  background:var(--gradient-hero);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
  box-shadow:0 2px 8px rgba(99,150,255,0.3);
}
.header-spacer{flex:1}
.header-btn{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);font-size:18px;transition:all var(--transition-fast);
  border:1px solid var(--border-subtle);
}
.header-btn:hover{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-card)}
.header-btn.theme-btn{font-size:16px}
.header-search-wrapper{position:relative;max-width:380px;width:100%}
.header-search-wrapper input{
  width:100%;padding:10px 14px 10px 40px;
  background:var(--bg-input);border:1px solid var(--border-input);
  border-radius:12px;color:var(--text-primary);font-size:13px;outline:none;
  transition:all var(--transition-fast);
}
.header-search-wrapper input::placeholder{color:var(--text-tertiary)}
.header-search-wrapper input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(99,150,255,0.1)}
.header-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:0.5;pointer-events:none}

/* Main Content */
.app-content{padding:0 24px 60px;max-width:1280px;margin:0 auto}

/* ============================================================
   HOME VIEW — Card Grid
   ============================================================ */
.home-view{display:block}
.calc-view{display:none}
.calc-view.active{display:block;animation:viewEnter var(--transition-smooth) ease}
@keyframes viewEnter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Hero */
.hero{padding:48px 0 32px;text-align:center}
.hero h1{font-size:clamp(32px,5vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1.1;margin-bottom:12px}
.hero h1 .gradient-text{background:var(--gradient-hero);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:15px;color:var(--text-secondary);max-width:500px;margin:0 auto 28px;line-height:1.7}
.hero-stats{display:flex;gap:32px;justify-content:center;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat .num{font-size:28px;font-weight:800;color:var(--text-primary);letter-spacing:-0.5px}
.hero-stat .lbl{font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}

/* Category Section */
.cat-section{margin-bottom:40px}
.cat-section-header{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
  padding-bottom:14px;border-bottom:1px solid var(--border-subtle);
}
.cat-icon-badge{
  width:40px;height:40px;border-radius:12px;
  background:var(--bg-card);border:1px solid var(--border-card);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  flex-shrink:0;
}
.cat-section-header h2{font-size:18px;font-weight:700;letter-spacing:-0.2px;color:var(--text-primary)}
.cat-count{font-size:12px;color:var(--text-tertiary);font-weight:500;margin-left:auto}

/* Calculator Card Grid */
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

/* Calculator Card */
.calc-card{
  background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:var(--radius-md);padding:18px 20px;
  cursor:pointer;transition:all var(--transition-fast);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:6px;
}
.calc-card::before{
  content:'';position:absolute;inset:0;
  background:var(--gradient-card);opacity:0;transition:opacity var(--transition-fast);
}
.calc-card:hover{
  background:var(--bg-card-hover);border-color:var(--border-accent);
  transform:translateY(-2px);box-shadow:var(--shadow-card-hover);
}
.calc-card:hover::before{opacity:1}
.calc-card:active{transform:scale(0.985)}
.calc-card-icon{font-size:22px;position:relative;z-index:1;line-height:1}
.calc-card-name{font-size:13.5px;font-weight:600;color:var(--text-primary);position:relative;z-index:1;letter-spacing:-0.1px;line-height:1.3}
.calc-card-desc{font-size:12px;color:var(--text-tertiary);position:relative;z-index:1;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.calc-card .card-indicator{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-tertiary);opacity:0;transition:all var(--transition-fast)}
.calc-card:hover .card-indicator{opacity:1;color:var(--text-accent);right:10px}

/* Category Card (landing) */
.cat-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:40px}
.cat-card{
  background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:var(--radius-lg);padding:28px;cursor:pointer;
  transition:all var(--transition-fast);position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:12px;
}
.cat-card::after{
  content:'';position:absolute;top:0;right:0;width:120px;height:120px;
  background:var(--gradient-hero);opacity:0.03;border-radius:0 0 0 120px;
  transition:all var(--transition-fast);
}
.cat-card:hover{background:var(--bg-card-hover);border-color:var(--border-accent);transform:translateY(-3px);box-shadow:var(--shadow-card-hover)}
.cat-card:hover::after{opacity:0.08;width:180px;height:180px}
.cat-card:active{transform:scale(0.985)}
.cat-card-icon{font-size:40px;line-height:1;position:relative;z-index:1}
.cat-card-name{font-size:19px;font-weight:700;color:var(--text-primary);position:relative;z-index:1;letter-spacing:-0.3px}
.cat-card-count{font-size:12px;color:var(--text-tertiary);font-weight:500;position:relative;z-index:1}
.cat-card-arrow{position:absolute;bottom:24px;right:28px;font-size:18px;color:var(--text-tertiary);transition:all var(--transition-fast);z-index:1}
.cat-card:hover .cat-card-arrow{color:var(--accent-1);right:20px}

/* Category Detail Header */
.cat-detail-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border-subtle)}
.cat-detail-header .cat-icon{font-size:32px}
.cat-detail-header h2{font-size:22px;font-weight:800;letter-spacing:-0.3px;flex:1}
.cat-detail-header .cat-count-badge{font-size:12px;color:var(--text-tertiary);background:var(--bg-elevated);padding:6px 12px;border-radius:20px;font-weight:500}

/* Hidden card (search filter) */
.calc-card.hidden,.cat-card.hidden{display:none}

/* ============================================================
   CALCULATOR VIEW — Full Screen
   ============================================================ */
.calc-view-container{animation:viewEnter var(--transition-smooth) ease}

.calc-view-header{
  display:flex;align-items:center;gap:14px;margin-bottom:32px;flex-wrap:wrap;
}
.btn-back{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--text-secondary);border:1px solid var(--border-card);
  transition:all var(--transition-fast);flex-shrink:0;
}
.btn-back:hover{background:var(--bg-card);color:var(--text-primary);border-color:var(--border-input)}
.calc-view-title{font-size:26px;font-weight:800;letter-spacing:-0.5px;color:var(--text-primary);flex:1;min-width:200px}
.btn-help{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:var(--text-tertiary);border:2px solid var(--border-input);
  transition:all var(--transition-fast);flex-shrink:0;
}
.btn-help:hover{background:var(--accent-1);border-color:var(--accent-1);color:#fff;box-shadow:var(--shadow-glow)}

.calc-view-desc{font-size:14px;color:var(--text-secondary);max-width:600px;line-height:1.7;margin-bottom:24px}

/* Help panel in calc view */
.help-panel{
  background:var(--bg-elevated);border:1px solid var(--border-accent);
  border-radius:var(--radius-md);padding:18px 22px;margin-bottom:20px;
  display:none;
}
.help-panel.open{display:block;animation:viewEnter var(--transition-fast) ease}
.help-panel h4{font-size:13px;font-weight:700;color:var(--accent-1);margin-bottom:6px}
.help-panel p{font-size:13px;color:var(--text-secondary);line-height:1.7}
.help-panel .formula{
  display:inline-block;margin-top:10px;padding:8px 14px;
  background:var(--bg-input);border-radius:var(--radius-sm);
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-1);
  border:1px solid var(--border-input);
}

/* Input card */
.input-card{
  background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;
}
.input-card-title{font-size:14px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px;color:var(--text-primary)}
.input-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-tertiary)}
.input-group input,.input-group select,.input-group textarea{
  padding:11px 14px;border:1.5px solid var(--border-input);
  border-radius:var(--radius-sm);font-size:14px;background:var(--bg-input);
  color:var(--text-primary);outline:none;transition:all var(--transition-fast);
  font-variant-numeric:tabular-nums;
}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{
  border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(99,150,255,0.08);
}
.input-group input::placeholder{color:var(--text-tertiary)}
.input-suffix{position:relative}
.input-suffix input{padding-right:48px;width:100%}
.input-suffix .suffix{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:13px;font-weight:600;color:var(--text-tertiary);pointer-events:none;
}

.btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{
  padding:11px 22px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;letter-spacing:0.2px;
  transition:all var(--transition-fast);display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{background:var(--gradient-btn);color:#fff;box-shadow:var(--shadow-btn)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 24px rgba(99,150,255,0.4)}
.btn-secondary{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-input)}
.btn-secondary:hover{background:var(--bg-card-hover);border-color:var(--border-card)}
.btn-outline{background:transparent;color:var(--accent-1);border:1.5px solid rgba(99,150,255,0.3)}
.btn-outline:hover{background:rgba(99,150,255,0.06);border-color:var(--accent-1)}

/* Results */
.results-panel{
  background:var(--gradient-result);border:1px solid var(--border-accent);
  border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;
}
.results-panel h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-accent);margin-bottom:16px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.result-item{
  background:var(--result-item-bg);border-radius:var(--radius-sm);
  padding:14px 16px;border:1px solid var(--result-item-border);
}
.result-item .label{font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-tertiary);margin-bottom:4px}
.result-item .value{font-size:21px;font-weight:800;letter-spacing:-0.3px;color:var(--text-primary);font-variant-numeric:tabular-nums}
.result-item .sub{font-size:11px;color:var(--text-tertiary);margin-top:3px}

/* Summary pills */
.summary-pills{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.summary-pill{
  background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:var(--radius-md);padding:14px 20px;flex:1;min-width:140px;
}
.summary-pill .label{font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-tertiary)}
.summary-pill .value{font-size:20px;font-weight:800;margin-top:3px}

/* Tables */
.table-wrap{border-radius:var(--radius-md);border:1px solid var(--border-card);overflow:hidden;margin-top:16px}
.table-scroll{max-height:400px;overflow-y:auto}
.table-wrap table{width:100%;border-collapse:collapse;font-size:12px}
.table-wrap th{background:var(--bg-elevated);padding:11px 14px;text-align:right;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-tertiary);white-space:nowrap;position:sticky;top:0;z-index:1}
.table-wrap th:first-child{text-align:center}
.table-wrap td{padding:10px 14px;text-align:right;border-top:1px solid var(--border-subtle);font-variant-numeric:tabular-nums}
.table-wrap td:first-child{text-align:center;color:var(--text-tertiary)}
.table-wrap tr:hover td{background:rgba(255,255,255,0.02)}

/* Tab pills */
.tab-row{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab-pill{
  padding:7px 16px;border-radius:20px;font-size:12px;font-weight:500;
  background:var(--bg-elevated);color:var(--text-secondary);border:1px solid var(--border-subtle);
  transition:all var(--transition-fast);cursor:pointer;
}
.tab-pill.active{background:var(--gradient-btn);color:#fff;border-color:transparent;box-shadow:var(--shadow-btn)}
.tab-pill:hover:not(.active){border-color:var(--border-input);color:var(--text-primary)}

/* Toast */
.toast-bar{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  padding:12px 20px;border-radius:12px;background:var(--bg-card);color:var(--text-primary);
  font-size:13px;font-weight:500;border:1px solid var(--border-card);
  box-shadow:var(--shadow-card-hover);animation:slideToast var(--transition-spring) ease;
  pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:360px;
  backdrop-filter:blur(12px);
}
.toast.error{border-color:rgba(248,113,113,0.3);color:var(--error)}
.toast.success{border-color:rgba(52,211,153,0.3);color:var(--success)}
@keyframes slideToast{from{opacity:0;transform:translateX(40px) scale(0.95)}to{opacity:1;transform:translateX(0) scale(1)}}

/* Chart canvas */
.chart-wrap{height:260px;position:relative}
.chart-wrap canvas{width:100%;height:100%}

/* Responsive */
@media(max-width:900px){
  .app-header{padding:0 16px}
  .header-search-wrapper{max-width:200px}
  .app-content{padding:0 16px 40px}
  .calc-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .input-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .result-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .hero{padding:32px 0 24px}
  .hero h1{font-size:28px}
}
@media(max-width:600px){

  if(n===null||n===undefined||isNaN(n)) return '—';
  const s = sym || STATE.currency;
  return s + ' ' + n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
};
const fmtPct = (n, d=2) => fmt(n,d)+'%';
const pv = v => {const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const toast = (msg, type='') => {

});

// --- Apply currency suffixes ---
function applyCurrencySuffixes(){
  $$('.input-suffix .suffix').forEach(s => {

    if(t && t.length <= 3 && !t.includes('%') && isNaN(t) && t !== 'yrs' && t !== 'mo') {

  });
}

function showCategory(catId){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(!cat) return;
  STATE.activeCategory=catId;
  $('#categoryCards').style.display='none';
  let html=`
    <div class="cat-detail-header">
      <button class="btn-back" onclick="renderHome()" title="Back to categories">←</button>
      <span class="cat-icon">${cat.icon}</span>
      <h2>${cat.name}</h2>
      <span class="cat-count-badge">${cat.calcs.length} tools</span>
    </div>
    <div class="calc-grid" id="activeCalcGrid">`;
  cat.calcs.forEach(c=>{
    html+=`<div class="calc-card" onclick="openCalc('${c.id}')" data-calc="${c.id}" data-cat="${catId}">`;
    html+=`<div class="calc-card-icon">${c.icon||'📊'}</div>`;
    html+=`<div class="calc-card-name">${c.name}</div>`;
    html+=`<div class="calc-card-desc">${c.desc}</div>`;
    html+=`<span class="card-indicator">→</span>`;
    html+=`</div>`;
  });
  html+='</div>';
  $('#categoryDetail').innerHTML=html;
  $('#categoryDetail').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}

function openCalc(calcId){
  const info = ALL_CALCS.get(calcId);
  if(!info) return;

  STATE.activeCalc=calcId;
  $('#categoryCards').style.display='none';
  $('#categoryDetail').style.display='none';
  $('#calcView').classList.add('active');
  $('#calcView').style.display='block';
  $('#headerSearchWrap').style.opacity='0.3';
  $('#headerSearchWrap').style.pointerEvents='none';
  window.scrollTo({top:0,behavior:'smooth'});

  let html=`
    <div class="calc-view-container">
      <div class="calc-view-header">
        <button class="btn-back" onclick="goBack()" title="Back">←</button>
        <h1 class="calc-view-title">${info.icon||''} ${info.name}</h1>
        <button class="btn-help" id="calcHelpBtn" title="What does this calculator do?">?</button>
      </div>
      <p class="calc-view-desc">${info.desc}</p>
      <div class="help-panel" id="calcHelpPanel"></div>
      <div id="calcBody"></div>
    </div>
  `;
  $('#calcView').innerHTML=html;

  const body = $('#calcBody');
  if(CALCULATORS[calcId]) CALCULATORS[calcId].render(body);

  // Apply current currency symbol to all suffix spans
  applyCurrencySuffixes();

  $('#calcHelpBtn').addEventListener('click',()=>{
    const panel=$('#calcHelpPanel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')&&!panel.dataset.loaded){
      panel.innerHTML=helpText(calcId);
      panel.dataset.loaded='1';
    }
  });
}

function goBack(){
  STATE.activeCalc=null;
  $('#calcView').classList.remove('active');
  $('#calcView').style.display='none';
  $('#calcView').innerHTML='';
  $('#headerSearchWrap').style.opacity='1';
  $('#headerSearchWrap').style.pointerEvents='auto';
  if(STATE.activeCategory){
    showCategory(STATE.activeCategory);
  } else {
    renderHome();
  }
}

function goHome(){
  STATE.activeCalc=null;
  STATE.activeCategory=null;
  $('#calcView').classList.remove('active');
  $('#calcView').style.display='none';
  $('#calcView').innerHTML='';
  $('#headerSearchWrap').style.opacity='1';
  $('#headerSearchWrap').style.pointerEvents='auto';
  renderHome();
  window.scrollTo({top:0,behavior:'smooth'});

const CALCULATORS = {};

// --- TVM ---
CALCULATORS.tvm = {
  render(ct){ct.innerHTML=`
    <div class="input-card"><div class="input-card-title">⚙️ Time Value of Money</div>
    <div class="input-grid">
      <div class="input-group"><label>${labelWithTip('Present Value (PV)','The current value of a future sum of money. Enter 0 if there is no initial lump sum.')}</label><div class="input-suffix"><input type="number" id="tvm-pv" placeholder="0.00" step="any"><span class="suffix">$</span></div></div>
      <div class="input-group"><label>${labelWithTip('Future Value (FV)','The desired or expected value at the end of the periods. Enter 0 if you want to find the FV.')}</label><div class="input-suffix"><input type="number" id="tvm-fv" placeholder="0.00" step="any"><span class="suffix">$</span></div></div>
      <div class="input-group"><label>${labelWithTip('Payment (PMT)','The regular payment amount per period. Use negative for outflows (payments you make), positive for inflows.')}</label><div class="input-suffix"><input type="number" id="tvm-pmt" placeholder="0.00" step="any"><span class="suffix">$</span></div></div>
      <div class="input-group"><label>${labelWithTip('Annual Rate (r)','The annual interest rate as a percentage. E.g., enter 5 for 5%.')}</label><div class="input-suffix"><input type="number" id="tvm-rate" placeholder="5.00" step="any"><span class="suffix">%</span></div></div>
      <div class="input-group"><label>${labelWithTip('Number of Periods (N)','Total number of compounding periods. E.g., for 20 years with quarterly compounding, enter 80 (20×4). For 30 years monthly, enter 360 (30×12).')}</label><input type="number" id="tvm-n" placeholder="80" step="any"></div>
      <div class="input-group"><label>Compounding</label><select id="tvm-comp"><option value="1">Annually</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></div>
      <div class="input-group"><label>${labelWithTip('Solve For','Select which variable to calculate. The other 4 must have values entered.')}</label><select id="tvm-solve"><option value="fv">Future Value (FV)</option><option value="pv">Present Value (PV)</option><option value="pmt">Payment (PMT)</option><option value="rate">Rate (r)</option><option value="n">Periods (n)</option></select></div>
      <div class="input-group"><label>${labelWithTip('Payment Timing','END: payments at end of each period (standard for loans, investments). BEGIN: payments at start (annuity due, lease).')}</label><select id="tvm-mode"><option value="end" selected>End of Period</option><option value="begin">Beginning of Period</option></select></div>
    </div><div class="btn-row"><button class="btn btn-primary" id="tvm-calc">Calculate</button><button class="btn btn-secondary" id="tvm-clear">Clear</button></div></div>
    <div id="tvm-results"></div>`;
    $('#tvm-calc').onclick=()=>{
      let pvStr=$('#tvm-pv').value.trim(),fvStr=$('#tvm-fv').value.trim(),pmtStr=$('#tvm-pmt').value.trim(),rateStr=$('#tvm-rate').value.trim(),nStr=$('#tvm-n').value.trim();
      let pv_=pv(pvStr),fv_=pv(fvStr),pmt_=pv(pmtStr),rate=pv(rateStr)/100,n_=pv(nStr),comp=+$('#tvm-comp').value,solve=$('#tvm-solve').value;
      let mode=$('#tvm-mode').value, isBegin=mode==='begin';
      let r=rate/comp,np=n_; // User enters total periods directly, rate is per-period
      // Check which inputs user filled (non-empty string)
      let filled=[pvStr!=='',fvStr!=='',pmtStr!=='',rateStr!=='',nStr!==''].filter(Boolean).length;
      if(filled<4){toast('Enter values for 4 fields — leave the one you want to solve for empty','error');return;}
      let result;
      // Helper: multiplier for BEGIN mode (1+r if begin, 1 if end)
      const B = isBegin ? (1+r) : 1;
      try{
        if(solve==='fv'){
          result = pv_*Math.pow(1+r,np) + pmt_*B*((Math.pow(1+r,np)-1)/r);
        }else if(solve==='pv'){
          if(fvStr!=='') result = (fv_ - pmt_*B*((Math.pow(1+r,np)-1)/r)) / Math.pow(1+r,np);
          else result = -pmt_*B*((1-Math.pow(1+r,-np))/r);
        }else if(solve==='pmt'){
          result = (fv_ - pv_*Math.pow(1+r,np)) / (B*((Math.pow(1+r,np)-1)/r));
        }else if(solve==='rate'){
          let g=r; // initial guess
          for(let i=0;i<200;i++){
            let pow = Math.pow(1+g,np);
            let f1 = pv_*pow + pmt_*B*((pow-1)/g) - fv_;
            // derivative: d/dg of the above
            let dpow = np*Math.pow(1+g,np-1);
            let f2 = pv_*dpow + pmt_*B*((np*Math.pow(1+g,np-1)*g - pow + 1)/(g*g));
            if(Math.abs(f2)<1e-15) break;
            g -= f1/f2;
            if(Math.abs(f1)<1e-10) break;
          }
          result = g*comp*100;
        }else{ // solve for n
          let num = fv_*r + pmt_*B;
          let den = pv_*r + pmt_*B;
          if(num<=0||den<=0||num/den<=0){toast('Cannot solve for n with these values — check signs','error');return;}
          result = Math.log(num/den)/Math.log(1+r);
        }
      }catch(e){toast('Calculation error — check your inputs','error');return;}
      let rl,rf;if(solve==='rate'){rl='Annual Rate';rf=fmtPct(result,3);}else if(solve==='n'){rl='Total Periods';rf=fmt(Math.max(0,result),2);}else{rl=solve==='fv'?'Future Value':solve==='pv'?'Present Value':'Payment';rf=fmt(result,2);}
      let aRate=solve==='rate'?result:rate*100,aN=solve==='n'?result:n_,aFV=solve==='fv'?result:fv_,aPV=solve==='pv'?result:pv_,aPMT=solve==='pmt'?result:pmt_,totP=aPMT*np,totI=aFV-aPV-totP;
      $('#tvm-results').innerHTML=`<div class="results-panel"><h3>Results — Solved for ${rl} (${isBegin?'Beginning':'End'} of Period)</h3><div class="result-grid"><div class="result-item"><div class="label">${rl}</div><div class="value">${rf}</div></div><div class="result-item"><div class="label">Present Value</div><div class="value">${fmt(aPV,2)}</div></div><div class="result-item"><div class="label">Future Value</div><div class="value">${fmt(aFV,2)}</div></div><div class="result-item"><div class="label">Payment</div><div class="value">${fmt(aPMT,2)}</div></div><div class="result-item"><div class="label">Total Payments</div><div class="value">${fmt(totP,2)}</div></div><div class="result-item"><div class="label">Total Interest</div><div class="value">${fmt(totI,2)}</div></div></div></div>`;
    };
    $('#tvm-clear').onclick=()=>{['pv','fv','pmt','rate','n'].forEach(x=>$('#tvm-'+x).value='');$('#tvm-results').innerHTML='';};
  }
};

// Helper: creates a simple calculator
function reg(id, title, inputs, fn){
  CALCULATORS[id] = {
    render(ct){
      let ih=inputs.map(inp=>{
        let lbl = inp.tip ? labelWithTip(inp.l, inp.tip) : inp.l;
        if(inp.t==='select')return `<div class="input-group"><label>${lbl}</label><select id="${id}-${inp.i}">${inp.o.map(o=>`<option value="${o.v}" ${o.s?'selected':''}>${o.lab}</option>`).join('')}</select></div>`;
        return `<div class="input-group"><label>${lbl}</label><div class="input-suffix"><input type="number" id="${id}-${inp.i}" value="${inp.v||''}" step="any" placeholder="${inp.ph||''}"><span class="suffix">${inp.s||''}</span></div></div>`;
      }).join('');
      ct.innerHTML=`<div class="input-card"><div class="input-card-title">⚙️ ${title}</div><div class="input-grid">${ih}</div><div class="btn-row"><button class="btn btn-primary" id="${id}-go">Calculate</button></div></div><div id="${id}-out"></div>`;
      $(`#${id}-go`).onclick=()=>{
        let vals={};inputs.forEach(inp=>{vals[inp.i]=inp.t==='select'?$(`#${id}-${inp.i}`).value:pv($(`#${id}-${inp.i}`).value);});
        let res=fn(vals,id);
        let rh='<div class="results-panel"><h3>Results</h3><div class="result-grid">';
        res.forEach(r=>rh+=`<div class="result-item"><div class="label">${r.l}</div><div class="value">${r.v}</div>${r.s?`<div class="sub">${r.s}</div>`:''}</div>`);
        rh+='</div></div>';$(`#${id}-out`).innerHTML=rh;
      };
    }
  };
}

CALCULATORS['date-calc'] = {
  render(ct){ct.innerHTML=`<div class="input-card"><div class="tab-row"><button class="tab-pill active" data-t="diff">Date Difference</button><button class="tab-pill" data-t="add">Add / Subtract</button></div><div id="date-tab-inner"></div></div><div id="date-out"></div>`;this._render('diff',ct);ct.querySelectorAll('.tab-pill').forEach(b=>b.onclick=()=>{ct.querySelectorAll('.tab-pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');this._render(b.dataset.t,ct);$('#date-out').innerHTML='';});},
  _render(t,ct){let tc=$('#date-tab-inner'),today=new Date().toISOString().split('T')[0],later=new Date(Date.now()+30*86400000).toISOString().split('T')[0];if(t==='diff')tc.innerHTML=`<div class="input-grid"><div class="input-group"><label>Start Date</label><input type="date" id="dd-start" value="${today}"></div><div class="input-group"><label>End Date</label><input type="date" id="dd-end" value="${later}"></div></div><div class="btn-row"><button class="btn btn-primary" id="dd-go">Calculate</button></div>`;else tc.innerHTML=`<div class="input-grid"><div class="input-group"><label>Start Date</label><input type="date" id="da-start" value="${today}"></div><div class="input-group"><label>Operation</label><select id="da-op"><option value="add">Add</option><option value="sub">Subtract</option></select></div><div class="input-group"><label>Number</label><input type="number" id="da-num" value="90" step="1"></div><div class="input-group"><label>Unit</label><select id="da-unit"><option value="days">Days</option><option value="weeks">Weeks</option><option value="months">Months</option><option value="years">Years</option></select></div></div><div class="btn-row"><button class="btn btn-primary" id="da-go">Calculate</button></div>`;let btn=t==='diff'?$('#dd-go'):$('#da-go');if(btn)btn.onclick=()=>{let r;if(t==='diff'){let d1=new Date($('#dd-start').value),d2=new Date($('#dd-end').value),days=Math.round((d2-d1)/86400000);r=[{l:'Days',v:days},{l:'Weeks',v:fmt(days/7,1)},{l:'Months',v:(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth())}];}else{let d=new Date($('#da-start').value),num=+$('#da-num').value,unit=$('#da-unit').value,op=$('#da-op').value,sign=op==='add'?1:-1,d2=new Date(d);if(unit==='days')d2.setDate(d2.getDate()+sign*num);else if(unit==='weeks')d2.setDate(d2.getDate()+sign*num*7);else if(unit==='months')d2.setMonth(d2.getMonth()+sign*num);else d2.setFullYear(d2.getFullYear()+sign*num);r=[{l:'Result',v:d2.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}];}let rh='<div class="results-panel"><h3>Result</h3><div class="result-grid">';r.forEach(x=>rh+=`<div class="result-item"><div class="label">${x.l}</div><div class="value">${x.v}</div></div>`);rh+='</div></div>';$('#date-out').innerHTML=rh;};}
};

// Unit Converter (custom)
CALCULATORS['unit-conversion'] = {
  conv:{length:{name:'Length',units:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.34,yd:0.9144,ft:0.3048,in:0.0254}},weight:{name:'Weight',units:{kg:1,g:0.001,mg:1e-6,lb:0.453592,oz:0.0283495}},volume:{name:'Volume',units:{l:1,ml:0.001,gal:3.78541,qt:0.946353,cup:0.236588,floz:0.0295735}},temp:{name:'Temperature',special:true},area:{name:'Area',units:{sqm:1,sqkm:1e6,sqft:0.092903,acre:4046.86,ha:10000}},speed:{name:'Speed',units:{ms:1,kmh:0.277778,mph:0.44704,knot:0.514444}}},
  render(ct){let cats=Object.entries(this.conv).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');ct.innerHTML=`<div class="input-card"><div class="input-card-title">📏 Unit Converter</div><div class="input-grid"><div class="input-group"><label>Category</label><select id="uc-type">${cats}</select></div><div class="input-group"><label>Value</label><input type="number" id="uc-val" value="1" step="any"></div><div class="input-group"><label>From</label><select id="uc-from"></select></div><div class="input-group"><label>To</label><select id="uc-to"></select></div></div><div class="btn-row"><button class="btn btn-primary" id="uc-go">Convert</button></div></div><div id="uc-out"></div>`;let self=this;function upd(){let type=$('#uc-type').value,conv=self.conv[type],f=$('#uc-from'),t=$('#uc-to');f.innerHTML='';t.innerHTML='';if(conv.special){['Celsius','Fahrenheit','Kelvin'].forEach((u,i)=>{f.innerHTML+=`<option value="${i}">${u}</option>`;t.innerHTML+=`<option value="${i}">${u}</option>`;});}else{Object.keys(conv.units).forEach(u=>{f.innerHTML+=`<option value="${u}">${u}</option>`;t.innerHTML+=`<option value="${u}">${u}</option>`;});}t.selectedIndex=1;}upd();$('#uc-type').onchange=upd;$('#uc-go').onclick=()=>{let type=$('#uc-type').value,conv=self.conv[type],val=pv($('#uc-val').value),from=$('#uc-from').value,to=$('#uc-to').value,result;if(conv.special){let c;if(from==='0')c=val;else if(from==='1')c=(val-32)*5/9;else c=val-273.15;if(to==='0')result=c;else if(to==='1')result=c*9/5+32;else result=c+273.15;}else result=val*conv.units[from]/conv.units[to];$('#uc-out').innerHTML=`<div class="results-panel"><h3>Conversion</h3><div class="result-grid"><div class="result-item"><div class="label">Result</div><div class="value">${fmt(result,6)} ${to}</div></div></div></div>`;};}
};

reg('inflation','US Inflation',[{i:'amt',l:'Amount',s:'$',v:'10000'},{i:'rate',l:'Annual Inflation',s:'%',v:'3'},{i:'years',l:'Years',v:'20'}],(v)=>[{l:`Future Cost`,v:fmt(v.amt*Math.pow(1+v.rate/100,v.years),2,'$'),s:`In ${v.years} yrs`},{l:'Past Equivalent',v:fmt(v.amt/Math.pow(1+v.rate/100,v.years),2,'$'),s:`${v.years} yrs ago`}]);

reg('tbill','Treasury Bill',[{i:'face',l:'Face Value',s:'$',v:'10000'},{i:'days',l:'Days to Maturity',v:'91'},{i:'discount',l:'Discount Yield',s:'%',v:'5.0'}],(v)=>{
  let disc=v.face*(v.discount/100)*(v.days/360),price=v.face-disc,invY=((v.face-price)/price)*(365/v.days)*100;
  return[{l:'Price',v:fmt(price,2,'$')},{l:'Investment Yield',v:fmtPct(invY,3)}];
});

reg('margin-markup','Margin & Markup',[{i:'cost',l:'Cost',s:'$',v:'80'},{i:'sell',l:'Selling Price',s:'$',v:'120'}],(v)=>{
  let profit=v.sell-v.cost,margin=profit/v.sell*100,markup=profit/v.cost*100;
  return[{l:'Profit',v:fmt(profit,2,'$')},{l:'Margin',v:fmtPct(margin,2),s:'% of selling price'},{l:'Markup',v:fmtPct(markup,2),s:'% of cost'}];
});

// Business Forecast (custom — multi-row)
CALCULATORS['business-forecast'] = {
  render(ct){ct.innerHTML=`<div class="input-card"><div class="input-card-title">📈 Business Forecast</div><div class="input-grid"><div class="input-group"><label>Current Revenue</label><div class="input-suffix"><input type="number" id="bf-rev" value="500000" step="any"><span class="suffix">$</span></div></div><div class="input-group"><label>Growth Rate</label><div class="input-suffix"><input type="number" id="bf-g" value="15" step="any"><span class="suffix">%</span></div></div><div class="input-group"><label>Years</label><input type="number" id="bf-y" value="5" min="1" max="20" step="1"></div></div><div class="btn-row"><button class="btn btn-primary" id="bf-go">Calculate</button></div></div><div id="bf-out"></div>`;
  $('#bf-go').onclick=()=>{let rev=pv($('#bf-rev').value),g=pv($('#bf-g').value)/100,y=+$('#bf-y').value,r=rev,items='';for(let i=1;i<=y;i++){r*=(1+g);items+=`<div class="result-item"><div class="label">Year ${i}</div><div class="value">${fmt(r,0,'$')}</div><div class="sub">${fmt(r-rev,0,'$')} growth</div></div>`;}$('#bf-out').innerHTML=`<div class="results-panel"><h3>Revenue Forecast</h3><div class="result-grid">${items}</div></div>`;};}
};

reg('fuel','Fuel Cost',[{i:'distance',l:'Distance',v:'300'},{i:'unit',l:'Unit',t:'select',o:[{v:'miles',l:'Miles',s:true},{v:'km',l:'Kilometers'}]},{i:'efficiency',l:'Efficiency',v:'30'},{i:'effUnit',l:'Efficiency Unit',t:'select',o:[{v:'mpg',l:'MPG',s:true},{v:'lp100',l:'L/100km'}]},{i:'fuelPrice',l:'Fuel Price',s:'$',v:'3.50'},{i:'people',l:'Split Between',v:'1'}],(v)=>{
  let fuel;if(v.effUnit==='mpg')fuel=v.unit==='miles'?v.distance/v.efficiency:v.distance/1.609/v.efficiency;else fuel=v.unit==='km'?v.distance/100*v.efficiency:v.distance*1.609/100*v.efficiency;
  return[{l:'Fuel Needed',v:fmt(fuel,1)+' gal'},{l:'Total Cost',v:fmt(fuel*v.fuelPrice,2,'$')},{l:'Per Person',v:fmt(fuel*v.fuelPrice/v.people,2,'$')}];
});

reg('hourly-salary','Hourly to Salary',[{i:'hourly',l:'Hourly Wage',s:'$',v:'25'},{i:'hours',l:'Hours/Week',v:'40'},{i:'weeks',l:'Weeks/Year',v:'52'}],(v)=>[{l:'Annual Salary',v:fmt(v.hourly*v.hours*v.weeks,2,'$')},{l:'Monthly Pay',v:fmt(v.hourly*v.hours*v.weeks/12,2,'$')},{l:'Weekly Pay',v:fmt(v.hourly*v.hours,2,'$')}]);

reg('salary-increase','Salary Increase',[{i:'salary',l:'Current Salary',s:'$',v:'60000'},{i:'increase',l:'Annual Increase',s:'%',v:'3'},{i:'years',l:'Years',v:'10'}],(v)=>[{l:`Salary in ${v.years} yrs`,v:fmt(v.salary*Math.pow(1+v.increase/100,v.years),2,'$')},{l:'Increase',v:fmt(v.salary*Math.pow(1+v.increase/100,v.years)-v.salary,2,'$')}]);

reg('paycheck-tax','US Paycheck Tax',[{i:'salary',l:'Annual Gross Salary',s:'$',v:'75000'},{i:'withhold',l:'Federal Withholding',s:'%',v:'15'},{i:'stateTax',l:'State Tax Rate',s:'%',v:'5'}],(v)=>{
  let ss=v.salary*0.062,med=v.salary*0.0145,fed=v.salary*v.withhold/100,state=v.salary*v.stateTax/100,tot=ss+med+fed+state,net=v.salary-tot;
  return[{l:'Take-Home (Annual)',v:fmt(net,2,'$')},{l:'Take-Home (Monthly)',v:fmt(net/12,2,'$')},{l:'Effective Tax Rate',v:fmtPct(tot/v.salary*100,1)}];
});

reg('net-distribution','Net Distribution',[{i:'amount',l:'Distribution Amount',s:'$',v:'50000'},{i:'fedRate',l:'Federal Tax Rate',s:'%',v:'22'},{i:'stateRate',l:'State Tax Rate',s:'%',v:'5'},{i:'penalty',l:'Early Penalty',s:'%',v:'0'}],(v)=>{
  let fed=v.amount*v.fedRate/100,state=v.amount*v.stateRate/100,pen=v.amount*v.penalty/100,net=v.amount-fed-state-pen;
  return[{l:'Net Amount',v:fmt(net,2,'$')},{l:'Total Tax',v:fmt(fed+state+pen,2,'$')}];
});

reg('effective-rate','Effective Rate',[{i:'nom',l:'Nominal Rate',s:'%',v:'12'},{i:'comp',l:'Compounding',t:'select',o:[{v:'12',l:'Monthly',s:true},{v:'4',l:'Quarterly'},{v:'2',l:'Semi-annual'},{v:'365',l:'Daily'},{v:'0',l:'Continuous'}]}],(v)=>{
  let c=+v.comp,ear=c===0?Math.exp(v.nom/100)-1:Math.pow(1+v.nom/100/c,c)-1;
  return[{l:'Effective Annual Rate',v:fmtPct(ear*100,3)},{l:'Difference',v:fmtPct((ear-v.nom/100)*100,3)}];
});

reg('financial-ratios','Financial Ratios',[{i:'currAssets',l:'Current Assets',s:'$',v:'500000'},{i:'currLiab',l:'Current Liabilities',s:'$',v:'250000'},{i:'totAssets',l:'Total Assets',s:'$',v:'2000000'},{i:'totLiab',l:'Total Liabilities',s:'$',v:'800000'},{i:'equity',l:'Shareholder Equity',s:'$',v:'1200000'},{i:'revenue',l:'Revenue',s:'$',v:'3000000'},{i:'netIncome',l:'Net Income',s:'$',v:'300000'}],(v)=>[
  {l:'Current Ratio',v:fmt(v.currAssets/v.currLiab,2)},{l:'Debt-to-Equity',v:fmt(v.totLiab/v.equity,2)},{l:'ROE',v:fmtPct(v.netIncome/v.equity*100,2)},{l:'ROA',v:fmtPct(v.netIncome/v.totAssets*100,2)},{l:'Profit Margin',v:fmtPct(v.netIncome/v.revenue*100,2)},{l:'Asset Turnover',v:fmt(v.revenue/v.totAssets,2)}
]);
